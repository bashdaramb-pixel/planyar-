/* Multi-floor planning, image gallery and proposal workspace. */
.system-tabs { grid-template-columns: repeat(6, minmax(0, 1fr)); }

.floor-manager { display: grid; grid-template-columns: minmax(145px, 1.1fr) minmax(145px, 1fr) minmax(110px, .7fr) auto; align-items: end; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #1a2c41; background: #0b1827; }

.floor-manager input, .floor-manager select { width: 100%; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #293d53; border-radius: 6px; color: #d7e2ed; background: #102034; font-size: 10px; }

.plan-gallery-section { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 8px 11px; border-top: 1px solid #1c3047; border-bottom: 1px solid #1c3047; background: linear-gradient(105deg, #0c1a29, #101d2d); }
.gallery-section-copy { min-width: 0; display: flex; align-items: center; gap: 8px; }

.proposal-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 13px; }

.proposal-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(82px, .38fr) minmax(92px, .42fr); align-items: center; gap: 7px; padding: 7px 0; border-top: 1px solid #1d3046; }
.proposal-line-title { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.proposal-line-title span { overflow: hidden; color: #71869d; font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }
.proposal-line > strong { color: #e3ebf4; font: 600 9px ui-monospace, monospace; direction: ltr; text-align: left; }

.proposal-wide-field { margin-top: 9px; }

.proposal-print { display: none; }
