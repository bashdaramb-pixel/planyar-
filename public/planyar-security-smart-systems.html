/* Multi-floor planning, image gallery and proposal workspace. */
.system-tabs { grid-template-columns: repeat(6, minmax(0, 1fr)); }

.floor-manager { display: grid; grid-template-columns: minmax(145px, 1.1fr) minmax(145px, 1fr) minmax(110px, .7fr) auto; align-items: end; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #1a2c41; background: #0b1827; }

.floor-manager input, .floor-manager select { width: 100%; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #293d53; border-radius: 6px; color: #d7e2ed; background: #102034; font-size: 10px; }

.plan-gallery-section { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 8px 11px; border-top: 1px solid #1c3047; border-bottom: 1px solid #1c3047; background: linear-gradient(105deg, #0c1a29, #101d2d); }
.gallery-section-copy { min-width: 0; display: flex; align-items: center; gap: 8px; }

.proposal-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 13px; }

.proposal-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(82px, .38fr) minmax(92px, .42fr); align-items: center; gap: 7px; padding: 7px 0; border-top: 1px solid #1d3046; }
.proposal-line-title { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.proposal-line-title span { overflow: hidden; color: #71869d; font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }
.proposal-line > strong { color: #e3ebf4; font: 600 9px ui-monospace, monospace; direction: ltr; text-align: left; }

.proposal-wide-field { margin-top: 9px; }

.proposal-print { display: none; }

<script id="planyar-inline-project-stages">
(()=>{const S=[['نەخشە و پێوانەی سەرەتایی','Site plan & survey','جۆری پرۆژە، پێوانە، نهۆم، ژوور، دەرگا و پەنجەرە دیاری بکە.'],['تراک، لەدر و بۆری','Trays, ladders & conduits','ڕێڕەوی کابل، جۆری تراک/بۆری، ماددە و پەیوەندییەکان دیزاین بکە.'],['کابلینگ و تۆڕ','Cabling & network','کابلی کارەبا، نێتوۆرک/PoE، فایبەر، تێلیکۆم و سولار دیاری بکە.'],['ژووری سێرڤەر و ڕاک','Server room & rack','ڕاک، سێرڤەر، NVR، پەنێڵ، UPS، نمایشگر و ساردکەرەوە دیاری بکە.'],['دامەزراندنی سیستەمەکان','System installation','کامێرا، وایفای، ئاگر، سمارتهۆم، تەلەفۆن، ئەکسس، قوفڵ، باریەر و دەرگا.']];
plan.workflow=plan.workflow||{};plan.workflow.stages=Array.isArray(plan.workflow.stages)?plan.workflow.stages:[];for(let i=0;i<S.length;i++)plan.workflow.stages[i]=Object.assign({done:false,note:'',status:'pending'},plan.workflow.stages[i]||{});plan.workflow.activeStage=Math.max(0,Math.min(4,Number(plan.workflow.activeStage)||0));
const section=document.createElement('section');section.id='py-stage-inline';section.dir='rtl';section.innerHTML='<div id="py-stage-head"><strong>ڕێڕەوی پڕۆژە · قۆناغ بە قۆناغ</strong><span id="py-stage-progress"></span></div><div id="py-stage-steps"></div><div id="py-stage-body"><div><div id="py-stage-title"></div><div id="py-stage-desc"></div></div><label><small>دۆخی کار</small><select id="py-stage-status"><option value="pending">دەستپێنەکراوە</option><option value="in-progress">لە کاردایە</option><option value="done">تەواو بوو</option></select></label><label><small>تێبینی</small><input id="py-stage-note" placeholder="تێبینیی ئەم قۆناغە"></label><div id="py-stage-actions"><button id="py-stage-prev">پێشوو</button><button id="py-stage-next" class="primary">تەواوکردن و قۆناغی داهاتوو ←</button></div></div>';
const anchor=$('layers');anchor.parentElement.insertBefore(section,anchor);

function render(){const idx=plan.workflow.activeStage,stages=plan.workflow.stages,done=stages.filter(x=>x.status==='done'||x.done).length;$('py-stage-progress').textContent=`قۆناغ ${idx+1} لە 5 · ${done}/5 تەواو`;const list=$('py-stage-steps');list.innerHTML=S.map((x,i)=>`<button type="button" data-stage="${i}" class="${i===idx?'active ':''}${stages[i].status==='done'||stages[i].done?'done':''}"><i>${stages[i].status==='done'||stages[i].done?'✓':i+1}</i><span>${x[0]}<br><small>${x[1]}</small></span></button>`).join('');list.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{plan.workflow.activeStage=Number(b.dataset.stage);render()});$('py-stage-title').textContent=`${idx+1}. ${S[idx][0]}`;$('py-stage-desc').textContent=S[idx][2];$('py-stage-status').value=stages[idx].status||((stages[idx].done)?'done':'pending');$('py-stage-note').value=stages[idx].note||'';$('py-stage-prev').disabled=idx===0;$('py-stage-next').textContent=idx===4?'تەواوکردنی قۆناغی کۆتایی':'تەواوکردن و قۆناغی داهاتوو ←'}
$('py-stage-status').onchange=()=>{const o=plan.workflow.stages[plan.workflow.activeStage];pushH();o.status=$('py-stage-status').value;o.done=o.status==='done';render();persist()};$('py-stage-note').onchange=()=>{pushH();plan.workflow.stages[plan.workflow.activeStage].note=$('py-stage-note').value;persist()};$('py-stage-prev').onclick=()=>{plan.workflow.activeStage=Math.max(0,plan.workflow.activeStage-1);render()};$('py-stage-next').onclick=()=>{pushH();const o=plan.workflow.stages[plan.workflow.activeStage];o.status='done';o.done=true;if(plan.workflow.activeStage<4)plan.workflow.activeStage++;render();persist()};render();const oldLoad=load;load=function(t){oldLoad(t);plan.workflow=plan.workflow||{};plan.workflow.stages=Array.isArray(plan.workflow.stages)?plan.workflow.stages:[];for(let i=0;i<S.length;i++)plan.workflow.stages[i]=Object.assign({done:false,note:'',status:'pending'},plan.workflow.stages[i]||{});plan.workflow.activeStage=Math.max(0,Math.min(4,Number(plan.workflow.activeStage)||0));render()}})();
